# cargo-deny configuration. See https://embarkstudios.github.io/cargo-deny/
#
# Run locally:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# CI runs the same via .github/workflows/audit.yml on every PR + every 6h cron.

[graph]
# Build the dep graph for the host target only — same as `cargo build`
# defaults. If we ever cross-compile (we don't today), add targets here.
all-features = true

[output]
feature-depth = 1

# ------------------------------------------------------------------- #
# Advisories — RustSec database (https://rustsec.org)                  #
# ------------------------------------------------------------------- #
[advisories]
version = 2
# Crates whose advisories we explicitly accept (with reason).
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack (timing sidechannel in `rsa` crate).
    # Reachable only via `sqlx-mysql`, which is pulled into the dependency
    # graph by `sqlx-macros-core` (proc-macro crate) but NOT compiled into
    # our binary — we enable only the `postgres` feature of `sqlx`:
    #
    #     sqlx = { version = "=0.8.6", default-features = false,
    #              features = ["postgres", ...], ... }
    #
    # The vulnerable RSA code path is unreachable from rust_events. No
    # upstream fix is published yet. Track the `rsa` crate for a release
    # with a constant-time implementation.
    #
    # Mirrored in .cargo/audit.toml for local `cargo audit` runs.
    { id = "RUSTSEC-2023-0071", reason = "rsa crate reachable only via sqlx-mysql which is not compiled (postgres-only sqlx features); see .cargo/audit.toml for full rationale" },
]
# Yanked crates aren't necessarily insecure, but they ARE a maintenance
# smell — surface them.
yanked = "warn"

# ------------------------------------------------------------------- #
# Licenses — allow only OSI-approved permissive + MPL                  #
# ------------------------------------------------------------------- #
[licenses]
version = 2
# Conservative allowlist. If a transitive dep introduces a license not
# on this list, cargo-deny will fail and force a conscious decision.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    # `webpki-roots` (transitive via sqlx-tls) ships the Mozilla CA bundle
    # under CDLA-Permissive-2.0. Linux Foundation permissive open-data
    # license, OSI-permissive equivalent — safe to bundle.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93
# Per-crate license overrides — empty by default; add only when a crate's
# license is unambiguous but cargo-deny can't auto-detect it.
exceptions = []

# ------------------------------------------------------------------- #
# Bans — duplicates, wildcards, specific crates                        #
# ------------------------------------------------------------------- #
[bans]
# Multiple versions of the same crate inflate compile time and binary
# size. Warn (not deny) — sometimes unavoidable in transitive trees.
multiple-versions = "warn"
# Cargo.toml uses exact `=` pins everywhere (see CLAUDE.md), so wildcards
# should never appear. Hard-deny to catch accidental loosening.
wildcards = "deny"
# Crate-level allow/deny lists — empty until we hit a real case. Pattern:
# `{ name = "openssl", reason = "…" }`.
deny = []
allow = []
# `multiple-versions = warn` would trip on standard duplicates from the
# Rust ecosystem (e.g. `syn 1.x` vs `syn 2.x`). We don't whitelist
# specific dupes here — operator reads the warning and decides.
skip = []
skip-tree = []

# ------------------------------------------------------------------- #
# Sources — crates.io + the pinned pg_work_queue git tag                #
# ------------------------------------------------------------------- #
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# `pg_work_queue` is consumed as a git-tag dep in Cargo.toml. Whitelist
# the exact upstream URL — anything else fails audit. Move to crates.io
# (and drop this entry) once pgwq publishes there.
allow-git = ["https://github.com/zygmunt-pawel/pg_work_queue.git"]
