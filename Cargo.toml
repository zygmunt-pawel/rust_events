[package]
name = "rust_events"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Transactional outbox for Rust services on Postgres, built on pg_work_queue"
repository = "https://github.com/pawel/rust_events"
documentation = "https://docs.rs/rust_events"
readme = "README.md"
keywords = ["outbox", "postgres", "event", "transactional", "queue"]
categories = ["database", "asynchronous"]

[dependencies]
pg_work_queue = { version = "=0.1.3", git = "https://github.com/zygmunt-pawel/pg_work_queue.git", tag = "v0.1.3" }
sqlx = { version = "=0.8.6", default-features = false, features = [
    "postgres", "runtime-tokio-rustls", "uuid", "chrono", "macros", "migrate",
] }
tokio = { version = "=1.52.3", features = ["rt", "macros", "time", "sync"] }
tracing = "=0.1.44"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
thiserror = "=2.0.18"
uuid = { version = "=1.23.1", features = ["v4", "v7", "serde"] }
chrono = { version = "=0.4.44", default-features = false, features = ["serde", "clock"] }
async-trait = "=0.1.89"
# FutureExt::catch_unwind: lets us wrap the user handler call inside
# handle_envelope so mark_*_fenced runs even on panic (otherwise pgwq's
# PanicPolicy bypasses our cleanup and the audit row stays 'running').
futures = { version = "=0.3.31", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "=1.52.3", features = ["full", "test-util"] }
testcontainers = "=0.27.3"
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
proptest = "=1.5.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
